name: Build Moharrir Android APK

on:
  workflow_dispatch:
  push:
    branches: [v4-professional-fix]
    paths:
      - 'android-v4-source.b64'
      - '.github/workflows/build-android-apk.yml'
      - 'README_APK_AR.md'
  pull_request:
    branches: [main]
    paths:
      - 'android-v4-source.b64'
      - '.github/workflows/build-android-apk.yml'
      - 'README_APK_AR.md'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify v4 source
        run: |
          echo 'cc625378f043ab21bd7d19d3dde020188f2ea0b7e34e5211d65948a6f0dc5d76  android-v4-source.b64' | sha256sum -c -
          base64 --decode android-v4-source.b64 > android-v4-source.tar.gz
          echo '90fae3f65124bbf030f1fd5f23440b581f8deefb3411edb9a8cd26e947ee39da  android-v4-source.tar.gz' | sha256sum -c -
          gzip -t android-v4-source.tar.gz
          mkdir -p android
          tar -xzf android-v4-source.tar.gz -C android
          test -f android/settings.gradle.kts
          python android/tests/verify_architecture.py
          grep -q 'SecureVaultProvider' android/app/src/main/AndroidManifest.xml
          grep -q 'probeCoordinatorKey' android/app/src/main/java/ma/gov/moharrir/independent/bus/OrchestrationService.java
          grep -q 'documentCategorySpinner' android/app/src/main/res/layout/activity_main.xml
          grep -q 'gpt-5.6-terra' android/app/src/main/java/ma/gov/moharrir/independent/ModelCatalog.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK product contract
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -q ':agent_coordinator'
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -q ':agent_finalizer'
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -q 'ma.gov.moharrir.independent.securevault'
          rm -rf apk-dex && mkdir apk-dex
          unzip -q "$APK" 'classes*.dex' -d apk-dex
          strings apk-dex/classes*.dex | grep -q 'private_memory_'
          strings apk-dex/classes*.dex | grep -q 'https://api.openai.com/v1/responses'
          strings apk-dex/classes*.dex | grep -q 'probeCoordinatorKey'
          strings apk-dex/classes*.dex | grep -q 'gpt-5.6-terra'
          strings apk-dex/classes*.dex | grep -q 'المراسلات والأجوبة الإدارية'
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moharrir-professional-v4-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
