name: Build Moharrir Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-v3.part*'
      - 'README_APK_AR.md'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-v3.part*'
      - 'README_APK_AR.md'
      - '.github/workflows/build-android-apk.yml'
      - 'android-build-trigger.txt'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source chunks
        run: |
          wc -c android-v3.part00 android-v3.part01 android-v3.part02 android-v3.part03 android-v3.part04 android-v3.part05 android-v3.part06 android-v3.part07
          sha256sum android-v3.part00 android-v3.part01 android-v3.part02 android-v3.part03 android-v3.part04 android-v3.part05 android-v3.part06 android-v3.part07

      - name: Restore and verify clean Android source
        run: |
          cat android-v3.part00 android-v3.part01 android-v3.part02 android-v3.part03 android-v3.part04 android-v3.part05 android-v3.part06 android-v3.part07 | base64 --decode > android-source.tar.gz
          gzip -t android-source.tar.gz
          mkdir -p android
          tar -xzf android-source.tar.gz -C android
          test -f android/settings.gradle.kts
          python android/tests/verify_architecture.py
          grep -q 'throws JSONException' android/app/src/main/java/ma/gov/moharrir/independent/agents/LocalToolRuntime.java
          grep -q 'throws JSONException' android/app/src/main/java/ma/gov/moharrir/independent/api/ResponsesClient.java
          grep -q 'IllegalStateException' android/app/src/main/java/ma/gov/moharrir/independent/protocol/AgentEnvelope.java
          grep -q 'IllegalStateException' android/app/src/main/java/ma/gov/moharrir/independent/protocol/AgentDecision.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK from clean source
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK structure
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep classes.dex
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -q ':agent_coordinator'
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -q ':agent_finalizer'
          unzip -p "$APK" classes.dex | strings | grep -q 'private_memory_'
          unzip -p "$APK" classes.dex | strings | grep -q 'https://api.openai.com/v1/responses'
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moharrir-independent-agents-v3-clean-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
