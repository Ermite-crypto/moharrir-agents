[project]
name = "moharrir-independent-agents"
version = "2.0.0"
description = "Moroccan administrative document editor using OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
  "pypdf",
  "python-docx"
]

[tool.pytest.ini_options]
pythonpath = ["."]
